[project]
name = "caresight-crew"
version = "0.1.0"
description = "CareSight multi-agent public-safety operations crew for CrewAI AMP deployment."
authors = [{ name = "CareSight" }]
requires-python = ">=3.11,<3.13"
dependencies = [
  "crewai>=1.14.0",
  "crewai-tools>=1.0.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
caresight_crew = "caresight_crew.main:run"
run_crew = "caresight_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caresight_crew"]

[tool.crewai]
type = "crew"
